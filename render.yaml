# Render Blueprint: free web service built from the Dockerfile.
# The database is a free Neon Postgres; paste its connection string as DATABASE_URL.
services:
  - type: web
    name: anyger-housekeeping
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Text messages (Phase 4). Leave SMS_PROVIDER unset to keep sending off.
      - key: SMS_PROVIDER
        sync: false
      - key: NOTIFY_PHONE_NUMBER
        sync: false
      - key: APP_URL
        sync: false
      - key: HTTPSMS_API_KEY
        sync: false
      - key: HTTPSMS_FROM
        sync: false
