# Render Blueprint: free web service built from the Dockerfile.
# The database is a free Neon Postgres; paste its connection string as DATABASE_URL.
services:
  - type: web
    name: anyger-housekeeping
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
