# Local development and test database only. Credentials are for localhost.
services:
  db:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: anyger
      POSTGRES_PASSWORD: anyger_local_only
      POSTGRES_DB: anyger
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anyger']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
