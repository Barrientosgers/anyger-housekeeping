name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anyger
          POSTGRES_PASSWORD: anyger_ci_only
          POSTGRES_DB: anyger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anyger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://anyger:anyger_ci_only@localhost:5432/anyger_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dev scripts still work (guards against a lockfile that drops native tools)
        run: |
          echo 'console.log("tsx ok")' > "$RUNNER_TEMP/smoke.ts"
          npx -w server tsx "$RUNNER_TEMP/smoke.ts"
          # Developers on a Mac need the macOS file listed too, even though CI runs on Linux.
          grep -q '"node_modules/@esbuild/darwin-arm64"' package-lock.json
          grep -q '"node_modules/@esbuild/linux-x64"' package-lock.json
      - run: npm run lint
      - run: npm run typecheck -w server
      - run: npm run coverage -w server
      - run: npm run coverage -w web
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    # Scans the whole git history on every push, so a leaked key is caught before it can ship.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --no-banner --redact --log-opts="--all"
