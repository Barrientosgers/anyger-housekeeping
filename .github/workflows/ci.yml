name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anyger
          POSTGRES_PASSWORD: anyger_ci_only
          POSTGRES_DB: anyger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U anyger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://anyger:anyger_ci_only@localhost:5432/anyger_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck -w server
      - run: npm run coverage -w server
      - run: npm run coverage -w web
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
